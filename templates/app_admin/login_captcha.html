<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به پنل مدیریت</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 360px;
        }
        h2 {
            text-align: center;
            margin-bottom: 28px;
            color: #333;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
        }
        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus { border-color: #1A73E8; }
        .captcha-box {
            background: #f8f9ff;
            border: 1px solid #dde;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 6px;
            font-size: 18px;
            font-weight: bold;
            color: #1A73E8;
            text-align: center;
            letter-spacing: 4px;
        }
        .error {
            background: #fff0f0;
            border: 1px solid #ffcccc;
            color: #d32f2f;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1A73E8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { background: #1558b0; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>🔐 پنل مدیریت</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="form-group">
            <label>نام کاربری</label>
            <input type="text" name="username" autofocus>
        </div>

        <div class="form-group">
            <label>رمز عبور</label>
            <input type="password" name="password">
        </div>

        <div class="form-group">
            <label>سوال امنیتی</label>
            <div class="captcha-box">{{ captcha_q }} = ?</div>
            <input type="number" name="captcha_answer"
                   placeholder="جواب را وارد کنید"
                   autocomplete="off">
        </div>

        <button type="submit">ورود</button>
    </form>
</div>
</body>
</html>
