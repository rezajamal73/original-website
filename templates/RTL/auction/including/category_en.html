{% load static %}

<div class="widget category">
    <h5 class="widget-title">Auction Categories</h5>

    <div class="category-list">
        {% for title, info in categories.items %}
            <a href="{% url 'app_auction_en:auction_category_en' info.slug_en|default:info.slug %}">
                <i class="far fa-arrow-right"></i>
                {{ title }}
                <span>({{ info.count }})</span>
            </a>
        {% endfor %}
    </div>
</div>
