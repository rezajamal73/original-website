{% load static %}

<div class="widget sidebar-tag">
    <h5 class="widget-title">برچسب‌های مزایده</h5>

    <div class="tag-list">
        {% for tag in tags %}
            {# ✅ auction_tag با tag.slug #}
            <a href="{% url 'app_auction:auction_tag' tag.slug %}">
                {{ tag.title_fa }}
            </a>
        {% empty %}
            <p>برچسبی موجود نیست.</p>
        {% endfor %}
    </div>
</div>
