{% load static %}

<div class="widget search">
    <h5 class="widget-title">Search Auctions</h5>

    <form class="search-form" id="auctionSearchForm" method="GET" action="{% url 'app_auction_en:auction_search_en' %}">
        <input
            class="form-control"
            type="text"
            name="s"
            id="auctionSearchInput"
            placeholder="Search here..."
            value="{{ request.GET.s|default:'' }}"
        >
        <button type="submit">
            <i class="far fa-search"></i>
        </button>
    </form>

    {% if request.GET.s and request.GET.s|length > 0 and auctions|length == 0 %}
        <p style="margin-top:10px; padding:10px; background:#ffe3e3; color:#c40000; border-radius:6px; font-size:14px;">
            <a href="{% url 'app_auction_en:auction_home_en' %}" style="color:#c40000; text-decoration:none;">❌</a>
            No results found for "<b>{{ request.GET.s }}</b>".
        </p>
    {% endif %}
</div>

<script>
document.getElementById("auctionSearchForm").addEventListener("submit", function (e) {
    const input = document.getElementById("auctionSearchInput").value.trim();

    if (input === "") {
        e.preventDefault();
        window.location.href = "{% url 'app_auction_en:auction_home_en' %}";
    }
});
</script>
