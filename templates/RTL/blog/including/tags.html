{% load static %}

<div class="widget sidebar-tag">
    <h5 class="widget-title">برچسب‌ها</h5>

    <div class="tag-list">
        {% for tag in tags %}
            <a href="{% url 'app_blog:blog_tag' tag.slug %}">
                {{ tag.title_fa }}
            </a>
        {% empty %}
            <p>هیچ برچسبی موجود نیست.</p>
        {% endfor %}
    </div>
</div>
