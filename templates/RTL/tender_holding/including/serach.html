{% load static %}

<div class="widget search">
    <h5 class="widget-title">جستجو در هلدینگ‌ها</h5>

    <form class="search-form" id="holdingSearchForm" method="GET" action="{% url 'app_tender_holding:search' %}">
        <input
            class="form-control"
            type="text"
            name="s"
            id="holdingSearchInput"
            placeholder="اینجا جستجو کنید ..."
            value="{{ request.GET.s|default:'' }}"
        >
        <button type="submit">
            <i class="far fa-search"></i>
        </button>
    </form>

    {% if request.GET.s and request.GET.s|length > 0 and holdings|length == 0 %}
        <p style="margin-top:10px; padding:10px; background:#ffe3e3; color:#c40000; border-radius:6px; font-size:14px;">
            <a href="{% url 'app_tender_holding:tender_holding_home' %}" style="color:#c40000; text-decoration:none;">❌</a>
            نتیجه‌ای برای "<b>{{ request.GET.s }}</b>" یافت نشد.
        </p>
    {% endif %}
</div>

<script>
document.getElementById("holdingSearchForm").addEventListener("submit", function (e) {
    const input = document.getElementById("holdingSearchInput").value.trim();

    // اگر سرچ خالی بود → بازگشت به صفحه اصلی هلدینگ‌ها
    if (input === "") {
        e.preventDefault();
        window.location.href = "{% url 'app_tender_holding:tender_holding_home' %}";
    }
});
</script>
