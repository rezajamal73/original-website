{% extends "admin/base_site.html" %}

{% block content %}
<div style="max-width:650px; padding:24px; direction:rtl; text-align:right;">
    <h2>تأیید عملیات امنیتی</h2>

    <p>
        آیا از انجام عملیات
        <strong>{{ operation }}</strong>
        برای IP زیر اطمینان دارید؟
    </p>

    <p style="font-size:20px;">
        <strong>{{ target_ip }}</strong>
    </p>

    <p style="color:#b45309;">
        توجه: مسدودسازی IP می‌تواند دسترسی کاربران آن شبکه
        به پنل مدیریت را قطع کند.
    </p>

    <form method="post" action="{{ action_url }}">
        {% csrf_token %}

        <button type="submit" class="button default">
            تأیید {{ operation }}
        </button>

        <a href="{{ back_url }}" style="margin-right:15px;">
            انصراف
        </a>
    </form>
</div>
{% endblock %}
