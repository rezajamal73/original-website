{% load static %}

<div class="widget recent-post">

    <h5 class="widget-title">Latest Articles</h5>

    {% for post in blogs %}

        <div class="recent-post-item">

            <div class="recent-post-img">
                {# ✅ اصلاح شد: get_absolute_url_en #}
                <a href="{{ post.get_absolute_url_en }}">
                    <img src="{{ post.image.url }}"
                         alt="{{ post.title_en|default:post.title_fa }}">
                </a>
            </div>

            <div class="recent-post-bio">
                <h6>
                    {# ✅ اصلاح شد #}
                    <a href="{{ post.get_absolute_url_en }}">
                        {{ post.title_en|default:post.title_fa|truncatechars:25 }}
                    </a>
                </h6>

                <span>
                    <i class="far fa-clock"></i>
                    {{ post.publish_date_en }}
                </span>
            </div>

        </div>

    {% endfor %}

</div>
